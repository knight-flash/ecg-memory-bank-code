[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-memory-bank"
version = "1.0.0"
description = "Source-only ECG Memory Bank paper code archive"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scipy==1.14.1",
  "scikit-learn==1.7.2",
  "torch==1.12.1",
  "tqdm==4.67.0",
  "faiss-cpu==1.7.4",
  "requests==2.32.4",
  "PyYAML==6.0.2",
  "matplotlib>=3.5,<4",
  "mne==1.9.0",
  "wfdb==4.1.2",
  "transformers==4.16.2",
  "torchvision==0.13.1",
  "wandb==0.18.6",
  "einops==0.8.0",
]

[project.urls]
Repository = "https://github.com/knight-flash/ecg-memory-bank-code"

[tool.setuptools.packages.find]
where = ["src"]

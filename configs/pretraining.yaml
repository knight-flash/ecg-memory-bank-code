network:
  ecg_model: ecgfounder
  num_leads: 12
  text_model: medcpt
  free_layers: 6
  feature_dim: 768
  projection_head:
    mlp_hidden_size: 256
    projection_size: 256
trainer:
  batch_size: 128
  val_batch_size: 128
  checkpoint_interval: 4
  max_epochs: 3
  num_workers: 8
  checkpoint: overridden_by_output_dir
optimizer:
  params:
    lr: 0.0001
    weight_decay: 0.00000001
zeroshot: {}
wandb_name: ecgfounder_medcpt_retrieval
